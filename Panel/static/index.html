<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="panel-token" content="__PANEL_TOKEN__">
<title>TradingBots</title>
<link rel="stylesheet" href="app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%232a78d6'/><path d='M7 21l6-6 4 4 8-9' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 16 16"><path d="M2 11l3.5-3.5 2.5 2.5 6-6.5" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      TradingBots
      <span class="brand-sub">бумажная торговля · Bitget фьючерсы · 4ч</span>
    </div>
    <div class="spacer"></div>
    <span class="meta" id="meta">подключение…</span>
    <button class="icon-btn" id="theme" title="Светлая / тёмная тема" aria-label="Сменить тему">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="3.2"/><path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M3.4 12.6l1.1-1.1M11.5 4.5l1.1-1.1" stroke-linecap="round"/></svg>
    </button>
    <button class="icon-btn" id="quit" title="Закрыть панель" aria-label="Закрыть панель">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 2v5.5"/><path d="M4.6 4.3a5 5 0 1 0 6.8 0"/></svg>
    </button>
  </header>

  <section class="hero" aria-live="polite">
    <div>
      <div class="hero-label">Деньги на счетах двух ботов</div>
      <div class="hero-value" id="hero-value">—</div>
      <div class="hero-delta" id="hero-delta"></div>
    </div>
    <div class="hero-side" id="hero-side"></div>
  </section>

  <section class="bots" id="bots"></section>

  <section class="section" id="demo"></section>

  <section class="section card">
    <div class="card-head">
      <div>
        <div class="card-title">Кривая баланса</div>
        <div class="card-sub">по закрытым сделкам</div>
      </div>
      <div class="spacer"></div>
      <div class="legend" id="eq-legend"></div>
      <div class="seg" role="tablist" aria-label="Вид">
        <button role="tab" aria-selected="true" data-eqview="chart">График</button>
        <button role="tab" aria-selected="false" data-eqview="table">Таблица</button>
      </div>
    </div>
    <div class="card-body">
      <div class="chart" id="eq-chart"></div>
      <div class="table-wrap" id="eq-table" hidden></div>
    </div>
  </section>

  <section class="section card">
    <div class="card-head">
      <div class="seg" role="tablist" aria-label="Разделы">
        <button role="tab" aria-selected="true" data-tab="positions">Позиции</button>
        <button role="tab" aria-selected="false" data-tab="trades">Сделки</button>
        <button role="tab" aria-selected="false" data-tab="log">Журнал</button>
        <button role="tab" aria-selected="false" data-tab="research">Стратегии</button>
      </div>
      <div class="spacer"></div>
      <div class="seg" id="log-bot" hidden>
        <button aria-selected="true" data-logbot="bot5">Дончиан</button>
        <button aria-selected="false" data-logbot="bot6">Supertrend</button>
        <button aria-selected="false" data-logbot="demo">Демо</button>
      </div>
    </div>
    <div class="card-body">
      <div data-panel="positions"></div>
      <div data-panel="trades" hidden></div>
      <div data-panel="log" hidden><div class="log" id="log"></div></div>
      <div data-panel="research" hidden></div>
    </div>
  </section>

</div>

<dialog id="quit-dialog">
  <div class="card-title">Закрыть панель?</div>
  <p class="muted" style="margin:10px 0 0">Боты продолжат работать в фоне. Чтобы вернуться к панели, снова запустите «Запустить панель».</p>
  <div class="dialog-actions">
    <button class="btn" value="cancel" id="quit-cancel">Отмена</button>
    <button class="btn primary" id="quit-ok">Закрыть панель</button>
  </div>
</dialog>

<script src="app.js"></script>
</body>
</html>
